 name: Docker CI/CD Pipeline on: push: branches: [ main ] jobs: build-scan-push: runs-on: ubuntu-latest steps: - name: Checkout code uses: actions/checkout@v4 - name: Build Docker image run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cloudops-app:latest . - name: Scan image with Trivy uses: aquasecurity/trivy-action@master with: image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/cloudops-app:latest format: table exit-code: 0 severity: CRITICAL,HIGH - name: Log in to Docker Hub uses: docker/login-action@v3 with: username: ${{ secrets.DOCKERHUB_USERNAME }} password: ${{ secrets.DOCKERHUB_TOKEN }} - name: Push image to Docker Hub run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cloudops-app:latest